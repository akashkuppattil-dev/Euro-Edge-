<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#78350f" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>
  
  <rect width="800" height="500" rx="16" fill="url(#bg)"/>
  
  <!-- Architectural Drafting Lines -->
  <g opacity="0.2" stroke="#fbbf24" stroke-width="1.5">
    <circle cx="400" cy="200" r="160"/>
    <line x1="200" y1="200" x2="600" y2="200"/>
    <line x1="400" y1="40" x2="400" y2="360"/>
    <polygon points="400,60 520,300 280,300"/>
  </g>

  <!-- Masonry Brickwork & Civil Compass Motif -->
  <g transform="translate(400, 200)" stroke="url(#accent)" stroke-width="5" fill="none">
    <!-- Brick Pattern -->
    <rect x="-120" y="-70" width="80" height="40" rx="3" fill="#0f172a" fill-opacity="0.8"/>
    <rect x="-35" y="-70" width="80" height="40" rx="3" fill="#0f172a" fill-opacity="0.8"/>
    <rect x="50" y="-70" width="80" height="40" rx="3" fill="#0f172a" fill-opacity="0.8"/>
    
    <rect x="-80" y="-25" width="80" height="40" rx="3" fill="#0f172a" fill-opacity="0.8"/>
    <rect x="5" y="-25" width="80" height="40" rx="3" fill="#0f172a" fill-opacity="0.8"/>
    
    <rect x="-120" y="20" width="80" height="40" rx="3" fill="#0f172a" fill-opacity="0.8"/>
    <rect x="-35" y="20" width="80" height="40" rx="3" fill="#0f172a" fill-opacity="0.8"/>
    <rect x="50" y="20" width="80" height="40" rx="3" fill="#0f172a" fill-opacity="0.8"/>
  </g>

  <!-- Title Badge -->
  <rect x="50" y="380" width="700" height="80" rx="12" fill="#0f172a" fill-opacity="0.8" stroke="#fbbf24" stroke-width="1.5"/>
  <text x="80" y="422" font-family="system-ui, sans-serif" font-weight="800" font-size="24" fill="#ffffff" letter-spacing="1">CIVIL MAINTENANCE</text>
  <text x="80" y="445" font-family="system-ui, sans-serif" font-weight="500" font-size="14" fill="#fde68a" letter-spacing="0.5">Concrete Restoration • Paving &amp; Masonry • Waterproofing • Dubai, UAE</text>
</svg>

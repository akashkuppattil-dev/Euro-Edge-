<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>
  
  <rect width="800" height="500" rx="16" fill="url(#bg)"/>
  
  <!-- Modern Building Skyline Silhouette -->
  <g opacity="0.2" fill="#ffffff">
    <rect x="80" y="150" width="80" height="250" rx="4"/>
    <rect x="180" y="100" width="100" height="300" rx="4"/>
    <rect x="300" y="80" width="120" height="320" rx="4"/>
    <rect x="440" y="120" width="90" height="280" rx="4"/>
    <rect x="550" y="180" width="110" height="220" rx="4"/>
  </g>

  <!-- Facility Shield & Operations Shield -->
  <g transform="translate(400, 200)" fill="none" stroke="url(#accent)" stroke-width="6">
    <path d="M0 -90 L80 -50 V20 C80 70 0 110 0 110 C0 110 -80 70 -80 20 V-50 Z" stroke="#34d399" stroke-width="5" fill="#0f172a" fill-opacity="0.6"/>
    <!-- Checkmark inside Shield -->
    <path d="M-30 10 L-10 30 L35 -20" stroke="#ffffff" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Title Badge -->
  <rect x="50" y="380" width="700" height="80" rx="12" fill="#0f172a" fill-opacity="0.8" stroke="#34d399" stroke-width="1.5"/>
  <text x="80" y="422" font-family="system-ui, sans-serif" font-weight="800" font-size="24" fill="#ffffff" letter-spacing="1">FACILITY MANAGEMENT</text>
  <text x="80" y="445" font-family="system-ui, sans-serif" font-weight="500" font-size="14" fill="#a7f3d0" letter-spacing="0.5">Turnkey Hard &amp; Soft FM • Commercial Towers • Gated Communities • Dubai, UAE</text>
</svg>

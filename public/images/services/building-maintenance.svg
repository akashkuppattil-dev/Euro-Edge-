<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
  </defs>
  
  <rect width="800" height="500" rx="16" fill="url(#bg)"/>
  
  <!-- Facade & Scaffolding Mesh Grid -->
  <g opacity="0.15" stroke="#38bdf8" stroke-width="1.5">
    <rect x="200" y="50" width="400" height="320" rx="6"/>
    <line x1="280" y1="50" x2="280" y2="370"/>
    <line x1="360" y1="50" x2="360" y2="370"/>
    <line x1="440" y1="50" x2="440" y2="370"/>
    <line x1="520" y1="50" x2="520" y2="370"/>
    
    <line x1="200" y1="110" x2="600" y2="110"/>
    <line x1="200" y1="170" x2="600" y2="170"/>
    <line x1="200" y1="230" x2="600" y2="230"/>
    <line x1="200" y1="290" x2="600" y2="290"/>
  </g>

  <!-- Central Building Maintenance Badge (Facade, Waterproofing, Handyman Tools) -->
  <g transform="translate(400, 190)" fill="none" stroke="url(#accent)" stroke-width="5">
    <rect x="-110" y="-85" width="220" height="170" rx="14" fill="#0f172a" fill-opacity="0.85" stroke="#38bdf8" stroke-width="3.5"/>
    
    <!-- Building Silhouette -->
    <path d="M-60 45 V-45 L0 -70 L60 -45 V45 Z" stroke="#38bdf8" stroke-width="3.5"/>
    
    <!-- Waterproofing Umbrella / Roof Shield -->
    <path d="M-30 -20 C-30 -40 30 -40 30 -20 Z" fill="#38bdf8" fill-opacity="0.3" stroke="#38bdf8" stroke-width="2.5"/>
    
    <!-- Crossed Handyman Hammer & Wrench -->
    <path d="M-25 15 L25 -15 M-25 -15 L25 15" stroke="#ffffff" stroke-width="4.5"/>
  </g>

  <!-- Title & Subtitle Badge -->
  <rect x="50" y="380" width="700" height="80" rx="12" fill="#0f172a" fill-opacity="0.85" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="80" y="422" font-family="system-ui, sans-serif" font-weight="800" font-size="24" fill="#ffffff" letter-spacing="1">BUILDING MAINTENANCE</text>
  <text x="80" y="445" font-family="system-ui, sans-serif" font-weight="500" font-size="14" fill="#bae6fd" letter-spacing="0.5">Facade &amp; Exterior Repairs • Roof Waterproofing • Handyman Fixes • Dubai, UAE</text>
</svg>

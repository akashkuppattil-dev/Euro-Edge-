<svg width="800" height="500" viewBox="0 0 800 500" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#4338ca" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
  </defs>
  
  <rect width="800" height="500" rx="16" fill="url(#bg)"/>
  
  <!-- Circuit Grid -->
  <g opacity="0.15" stroke="#a855f7" stroke-width="1.5">
    <path d="M50 100 H250 V200 H450 V350 H750"/>
    <path d="M100 400 H350 V250 H600 V100 H750"/>
    <circle cx="250" cy="200" r="6" fill="#a855f7"/>
    <circle cx="450" cy="350" r="6" fill="#a855f7"/>
    <circle cx="350" cy="250" r="6" fill="#6366f1"/>
    <circle cx="600" cy="100" r="6" fill="#6366f1"/>
  </g>

  <!-- Diagnostic & Headset Support Motif -->
  <g transform="translate(400, 210)" fill="none" stroke="url(#accent)" stroke-width="6">
    <!-- Pulse Line / Diagnostic Waves -->
    <path d="M-220 0 L-100 0 L-60 -60 L-20 80 L30 -90 L70 50 L110 -20 L220 0" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="30" cy="-90" r="8" fill="#a855f7"/>
    
    <!-- Headphones / Support Badge -->
    <circle cx="0" cy="0" r="110" stroke="#6366f1" stroke-dasharray="8 8" stroke-width="3"/>
  </g>

  <!-- Title Badge -->
  <rect x="50" y="380" width="700" height="80" rx="12" fill="#0f172a" fill-opacity="0.8" stroke="#6366f1" stroke-width="1.5"/>
  <text x="80" y="422" font-family="system-ui, sans-serif" font-weight="800" font-size="24" fill="#ffffff" letter-spacing="1">TECHNICAL SUPPORT &amp; TROUBLESHOOTING</text>
  <text x="80" y="445" font-family="system-ui, sans-serif" font-weight="500" font-size="14" fill="#cbd5e1" letter-spacing="0.5">24/7 Rapid Emergency Response • Thermal Audit • Diagnostic Fault Finding • Dubai, UAE</text>
</svg>
